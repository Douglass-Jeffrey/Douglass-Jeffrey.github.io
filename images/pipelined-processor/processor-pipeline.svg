<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Verdana, Geneva, Tahoma, sans-serif">
  <title>Block diagram of the 5-stage pipelined RV32I processor and its memory system</title>
  <defs>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d9d9d"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ce9178"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#252526"/>

  <!-- Forwarding paths: MEM and WB back into EX -->
  <g fill="none" stroke="#ce9178" stroke-width="1.5" marker-end="url(#arrow-orange)">
    <path d="M408,64 C408,34 304,34 304,62"/>
    <path d="M520,64 C520,18 290,18 290,62"/>
  </g>
  <text x="406" y="14" font-size="11" fill="#ce9178" text-anchor="middle">forwarding</text>

  <!-- Stage-to-stage flow, drawn under the pipeline registers -->
  <g stroke="#9d9d9d" stroke-width="1.5" marker-end="url(#arrow-grey)">
    <line x1="114" y1="94" x2="140" y2="94"/>
    <line x1="226" y1="94" x2="252" y2="94"/>
    <line x1="338" y1="94" x2="364" y2="94"/>
    <line x1="450" y1="94" x2="476" y2="94"/>
  </g>

  <!-- Pipeline registers -->
  <g fill="#6a6a6a">
    <rect x="125" y="58" width="6" height="72"/>
    <rect x="237" y="58" width="6" height="72"/>
    <rect x="349" y="58" width="6" height="72"/>
    <rect x="461" y="58" width="6" height="72"/>
  </g>

  <!-- Stages -->
  <g fill="#1e1e1e" stroke="#3794ff" stroke-width="2">
    <rect x="30"  y="64" width="84" height="60" rx="6"/>
    <rect x="142" y="64" width="84" height="60" rx="6"/>
    <rect x="254" y="64" width="84" height="60" rx="6"/>
    <rect x="366" y="64" width="84" height="60" rx="6"/>
    <rect x="478" y="64" width="84" height="60" rx="6"/>
  </g>
  <g fill="#d4d4d4" font-size="20" font-weight="bold" text-anchor="middle">
    <text x="72"  y="98">IF</text>
    <text x="184" y="98">ID</text>
    <text x="296" y="98">EX</text>
    <text x="408" y="98">MEM</text>
    <text x="520" y="98">WB</text>
  </g>
  <g fill="#9d9d9d" font-size="10" text-anchor="middle">
    <text x="72"  y="115">fetch</text>
    <text x="184" y="115">decode</text>
    <text x="296" y="115">execute</text>
    <text x="408" y="115">memory</text>
    <text x="520" y="115">write back</text>
  </g>

  <!-- Memory system wiring -->
  <g fill="none" stroke="#9d9d9d" stroke-width="1.5">
    <line x1="72" y1="124" x2="72" y2="180"/>
    <line x1="408" y1="124" x2="408" y2="180"/>
    <polyline points="72,220 72,264 150,264"/>
    <line x1="408" y1="220" x2="408" y2="250"/>
    <line x1="220" y1="278" x2="220" y2="306"/>
    <line x1="290" y1="320" x2="330" y2="320"/>
  </g>

  <!-- Caches -->
  <g fill="#1e1e1e" stroke="#4ec9b0" stroke-width="2">
    <rect x="30"  y="180" width="84" height="40" rx="6"/>
    <rect x="366" y="180" width="84" height="40" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="72"  y="197" font-size="12" fill="#d4d4d4">icache</text>
    <text x="72"  y="211" font-size="10" fill="#9d9d9d">8 KB</text>
    <text x="408" y="197" font-size="12" fill="#d4d4d4">dcache</text>
    <text x="408" y="211" font-size="10" fill="#9d9d9d">16 KB</text>
  </g>

  <!-- Arbiter, SRAM controller, SRAM -->
  <g fill="#1e1e1e" stroke="#6a6a6a" stroke-width="1.5">
    <rect x="150" y="250" width="300" height="28" rx="5"/>
    <rect x="150" y="306" width="140" height="28" rx="5"/>
    <rect x="330" y="306" width="120" height="28" rx="5"/>
  </g>
  <g fill="#d4d4d4" font-size="11" text-anchor="middle">
    <text x="300" y="268">memory arbiter</text>
    <text x="220" y="324">SRAM controller</text>
    <text x="390" y="324">512 KB SRAM</text>
  </g>

  <text x="300" y="378" font-size="12" fill="#9d9d9d" text-anchor="middle">RV32I · Cyclone II FPGA (DE1) · 50 MHz</text>
</svg>
